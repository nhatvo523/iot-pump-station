services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - nodered-data:/data
    depends_on:
      - mosquitto
      - tdengine
    restart: unless-stopped

  tdengine:
    image: tdengine/tsdb:latest        # after it runs OK, pin the exact version
    container_name: tdengine
    hostname: tdengine
    environment:
      - TAOS_FQDN=tdengine
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "6041:6041"
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos
    restart: unless-stopped

volumes:
  mosquitto-data:
  nodered-data:
  tdengine-data:
  tdengine-log: