services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - nodered-data:/data
    depends_on:
      - mosquitto
      - tdengine
    restart: unless-stopped

  tdengine:
    image: tdengine/tsdb:latest        # after it runs OK, pin the exact version
    container_name: tdengine
    hostname: tdengine
    environment:
      - TAOS_FQDN=tdengine
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "6041:6041"
      - "6060:6060"
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: iot-pump-grafana
    ports:
      - "3001:3000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_PLUGINS_PREINSTALL_SYNC=tdengine-datasource@4.0.2@https://github.com/taosdata/grafanaplugin/releases/download/v4.0.2/tdengine-datasource-4.0.2.zip
      - TDENGINE_BASIC_AUTH=${TDENGINE_BASIC_AUTH:-cm9vdDp0YW9zZGF0YQ==}
    volumes:
      - grafana-project-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  mosquitto-data:
  nodered-data:
  tdengine-data:
  tdengine-log:
  grafana-project-data:
